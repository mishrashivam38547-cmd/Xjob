<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Multi Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-white">Admin Dashboard</h1>

        <!-- Multi-Upload Form Section -->
        <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-white">Add Multiple Cards (Up to 10-12 at once)</h2>
            <form id="admin-form" class="space-y-6">
                
                <div id="cards-fields-container" class="space-y-4">
                    <!-- Dynamic Row Template will be injected here -->
                </div>

                <div class="flex gap-4 flex-col sm:flex-row">
                    <button type="button" id="add-row-btn" class="bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 transition font-semibold text-center">+ Add More Link</button>
                    <button type="submit" id="submit-btn" class="flex-grow bg-red-600 text-white font-semibold py-3 rounded-lg hover:bg-red-700 transition text-center">Publish All Cards</button>
                </div>
            </form>
        </div>

        <!-- Manage Cards Section -->
        <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-white">Manage Existing Cards</h2>
            <div id="admin-cards-list" class="space-y-4">
                <!-- Admin Cards List -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0OEHSls-lVvUt8L_ESM6BCnWH1mlfumk",
            authDomain: "xjob-39339.firebaseapp.com",
            projectId: "xjob-39339",
            storageBucket: "xjob-39339.firebasestorage.app",
            messagingSenderId: "338051774766",
            appId: "1:338051774766:web:3d27bbd138f2545747e2bf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "6b3572dc389203765c95911b2ac150e2";

        const container = document.getElementById("cards-fields-container");
        const addRowBtn = document.getElementById("add-row-btn");
        const form = document.getElementById("admin-form");
        const submitBtn = document.getElementById("submit-btn");

        // Function to add a new row for card input
        function addNewRow() {
            const rowCount = container.children.length + 1;
            if(rowCount > 12) {
                alert("Aap ek baar mein maximum 12 cards hi add kar sakte hain.");
                return;
            }

            const rowDiv = document.createElement("div");
            rowDiv.className = "card-row border border-neutral-700 p-4 rounded-lg bg-neutral-800 relative space-y-3";
            rowDiv.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-red-400">Card #${rowCount}</span>
                    <button type="button" class="text-red-400 text-sm hover:underline remove-row">Remove</button>
                </div>
                <div>
                    <label class="block text-gray-300 text-xs mb-1">Select Image</label>
                    <input type="file" class="row-image w-full border border-neutral-700 bg-neutral-900 p-2 rounded text-sm" accept="image/*" required>
                </div>
                <div>
                    <label class="block text-gray-300 text-xs mb-1">Text Description</label>
                    <textarea class="row-text w-full border border-neutral-700 bg-neutral-900 p-2 rounded text-sm" rows="2" placeholder="Enter text..." required></textarea>
                </div>
                <div>
                    <label class="block text-gray-300 text-xs mb-1">Target Link (URL)</label>
                    <input type="url" class="row-link w-full border border-neutral-700 bg-neutral-900 p-2 rounded text-sm" placeholder="https://example.com" required>
                </div>
            `;

            rowDiv.querySelector(".remove-row").addEventListener("click", () => {
                if(container.children.length > 1) {
                    rowDiv.remove();
                } else {
                    alert("Kam se kam ek row hona zaroori hai.");
                }
            });

            container.appendChild(rowDiv);
        }

        // Default 1 row add rahegi load hone par
        addNewRow();

        addRowBtn.addEventListener("click", addNewRow);

        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.success) return data.data.url;
            else throw new Error("Image upload failed");
        }

        // Handle Bulk Submit
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Uploading all cards...";

            const rows = document.querySelectorAll(".card-row");

            try {
                for (let row of rows) {
                    const imageFile = row.querySelector(".row-image").files[0];
                    const text = row.querySelector(".row-text").value;
                    const link = row.querySelector(".row-link").value;

                    if (imageFile) {
                        const imageUrl = await uploadToImgBB(imageFile);
                        await addDoc(collection(db, "posts"), {
                            imageUrl,
                            text,
                            link,
                            timestamp: Date.now()
                        });
                    }
                }

                alert("All cards published successfully!");
                container.innerHTML = "";
                addNewRow();
                loadAdminCards();
            } catch (error) {
                console.error("Error:", error);
                alert("Kuch error aaya: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Publish All Cards";
            }
        });

        // Load Existing Cards for Management/Deletion
        async function loadAdminCards() {
            const listContainer = document.getElementById("admin-cards-list");
            listContainer.innerHTML = "<p class='text-gray-400'>Loading...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                listContainer.innerHTML = "";
                
                if (querySnapshot.empty) {
                    listContainer.innerHTML = "<p class='text-gray-400'>Koi card available nahi hai.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const id = docSnap.id;

                    const itemHTML = `
                        <div class="flex items-center justify-between border-b border-neutral-800 pb-4 gap-4 bg-neutral-800 p-3 rounded">
                            <img src="${post.imageUrl}" class="w-16 h-16 object-cover rounded">
                            <div class="flex-grow">
                                <p class="text-sm text-white line-clamp-1"><b>Text:</b> ${post.text}</p>
                                <a href="${post.link}" target="_blank" class="text-red-400 text-xs underline truncate block max-w-xs">${post.link}</a>
                            </div>
                            <div>
                                <button type="button" onclick="window.deletePost('${id}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">Delete</button>
                            </div>
                        </div>
                    `;
                    listContainer.innerHTML += itemHTML;
                });
            } catch (error) {
                console.error("Error loading cards:", error);
            }
        }

        window.deletePost = async function(id) {
            if (confirm("Kya aap is card ko delete karna chahte hain?")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("Card deleted successfully!");
                    loadAdminCards();
                } catch (error) {
                    alert("Delete karne mein error aaya.");
                }
            }
        }

        loadAdminCards();
    </script>
</body>
</html>
