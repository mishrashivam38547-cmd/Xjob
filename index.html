<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Blog / Updates</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Latest Updates</h1>
        
        <!-- Cards Container -->
        <div id="user-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Here -->
        </div>
    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD0OEHSls-lVvUt8L_ESM6BCnWH1mlfumk",
        authDomain: "xjob-39339.firebaseapp.com",
        projectId: "xjob-39339",
        storageBucket: "xjob-39339.firebasestorage.app",
        messagingSenderId: "338051774766",
        appId: "1:338051774766:web:3d27bbd138f2545747e2bf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadUserCards() {
        const container = document.getElementById("user-cards-container");
        container.innerHTML = "<p class='text-center col-span-full'>Loading...</p>";

        try {
            // Bina orderBy ke data fetch kar rahe hain taaki error na aaye
            const querySnapshot = await getDocs(collection(db, "posts"));
            
            container.innerHTML = "";
            if (querySnapshot.empty) {
                container.innerHTML = "<p class='text-center col-span-full text-gray-500'>Koi post available nahi hai.</p>";
                return;
            }

            querySnapshot.forEach((doc) => {
                const post = doc.data();
                const cardHTML = `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col justify-between border">
                        <img src="${post.imageUrl}" alt="Image" class="w-full h-48 object-cover">
                        <div class="p-4 flex-grow">
                            <p class="text-gray-700 text-base mb-4">${post.text}</p>
                        </div>
                        <div class="p-4 bg-gray-50 border-t">
                            <a href="${post.link}" target="_blank" class="block w-full text-center bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">
                                Visit Link
                             </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        } catch (error) {
            console.error("Error loading posts: ", error);
            container.innerHTML = "<p class='text-center col-span-full text-red-500'>Error loading data.</p>";
        }
    }

    loadUserCards();
</script>
</body>
</html>
